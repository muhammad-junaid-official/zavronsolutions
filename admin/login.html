<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Zavron Solutions</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-login-wrapper">
    <div class="login-card">
      <!-- Brand Logo -->
      <div class="login-brand">
        <div class="login-brand-icon" style="background: linear-gradient(135deg, #0A1F35 0%, #040D18 100%); border: 1px solid rgba(255, 122, 0, 0.45); box-shadow: 0 4px 14px rgba(255, 122, 0, 0.25);">
          <svg width="24" height="24" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 18H48L24 46H48" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="48" cy="18" r="4.5" fill="#FF7A00" />
          </svg>
        </div>
        <div class="login-brand-text">
          <h3 style="color: #FFFFFF; letter-spacing: 0.05em;">ZAVRON</h3>
          <span style="color: #FF7A00; letter-spacing: 0.15em; font-weight: 700;">SOLUTIONS</span>
        </div>
      </div>

      <h1 class="login-title">Administrator Login</h1>
      <p class="login-subtitle">Sign in to manage blog publications, content architecture, and live SEO performance.</p>

      <div id="loginAlert" class="login-alert"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <input
            type="email"
            id="adminEmail"
            class="form-control"
            placeholder="admin@zavronsolutions.com"
            required
            autocomplete="email"
            value="admin@zavronsolutions.com"
          />
        </div>

        <div class="form-group">
          <label for="adminPassword">Security Password</label>
          <input
            type="password"
            id="adminPassword"
            class="form-control"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Authenticate & Access Dashboard →</button>
      </form>

      <div class="login-footer-hint">
        🔒 Authorized Personnel Only • Protected by AES Token Session
      </div>
    </div>
  </div>

  <script type="module">
    // Auto redirect if already logged in
    const token = localStorage.getItem('zavron_admin_token');
    if (token) {
      window.location.href = '/admin/';
    }

    const form = document.getElementById('adminLoginForm');
    const alertEl = document.getElementById('loginAlert');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';
      alertEl.className = 'login-alert';
      alertEl.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('zavron_admin_token', data.token);
          localStorage.setItem('zavron_admin_user', JSON.stringify(data.user));
          window.location.href = '/admin/';
        } else {
          showError(data.error || 'Invalid administrator email or password.');
        }
      } catch (err) {
        // Client fallback validation if server is running standalone Vite dev
        if (email.toLowerCase() === 'admin@zavronsolutions.com' && password === 'ZavronAdmin2026!') {
          const fallbackToken = 'ztk_' + Date.now() + '_' + Math.random().toString(36).substr(2);
          localStorage.setItem('zavron_admin_token', fallbackToken);
          localStorage.setItem('zavron_admin_user', JSON.stringify({ name: 'Zavron Admin', email }));
          window.location.href = '/admin/';
        } else {
          showError('Invalid email or password. Default: admin@zavronsolutions.com / ZavronAdmin2026!');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Authenticate & Access Dashboard →';
      }
    });

    function showError(msg) {
      alertEl.textContent = msg;
      alertEl.className = 'login-alert error';
      alertEl.style.display = 'block';
    }
  </script>
</body>
</html>
