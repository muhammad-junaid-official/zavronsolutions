<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
      

  <title>Admin Portal Login | Zavron Solutions</title>
  <!-- zs:icons -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <!-- zs:fonts (non-render-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap"></noscript>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/css/admin.css">

  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": "https://www.zavronsolutions.com/admin/login#webpage",
      "url": "https://www.zavronsolutions.com/admin/login",
      "name": "Admin Portal Login | Zavron Solutions",
      "description": "Zavron Solutions Digital Agency",
      "isPartOf": {
        "@id": "https://www.zavronsolutions.com/#website"
      }
    },
    {
      "@type": "Organization",
      "@id": "https://www.zavronsolutions.com/#organization",
      "name": "Zavron Solutions",
      "url": "https://www.zavronsolutions.com/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.zavronsolutions.com/assets/favicon.svg"
      }
    }
  ]
}
  </script>
</head>
<body class="admin-body">
  <div class="admin-login-wrapper">
    <div class="login-card">
      <!-- Brand Logo -->
      <div class="login-brand">
        <div class="login-brand-icon" style="background: linear-gradient(135deg, #0A1F35 0%, #040D18 100%); border: 1px solid rgba(255, 122, 0, 0.45); box-shadow: 0 4px 14px rgba(255, 122, 0, 0.25);">
          <svg width="24" height="24" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 18H48L24 46H48" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="48" cy="18" r="4.5" fill="#FF7A00" />
          </svg>
        </div>
        <div class="login-brand-text">
          <h3 style="color: #FFFFFF; letter-spacing: 0.05em;">ZAVRON</h3>
          <span style="color: #FF7A00; letter-spacing: 0.15em; font-weight: 700;">SOLUTIONS</span>
        </div>
      </div>

      <h1 class="login-title">Administrator Login</h1>
      <p class="login-subtitle">Sign in to manage blog publications, content architecture, and live SEO performance.</p>

      <div id="loginAlert" class="login-alert"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <input
            type="email"
            id="adminEmail"
            class="form-control"
            placeholder="info@zavronsolutions.com"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="adminPassword">Security Password</label>
          <input
            type="password"
            id="adminPassword"
            class="form-control"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Authenticate & Access Dashboard →</button>
      </form>

      <div class="login-footer-hint">
        🔒 Authorized Personnel Only • Secure HttpOnly Session
      </div>
    </div>
  </div>

  <script type="module">
    const form = document.getElementById('adminLoginForm');
    const alertEl = document.getElementById('loginAlert');
    const btn = document.getElementById('loginBtn');

    function showMessage(msg, type = 'error') {
      alertEl.textContent = msg;
      alertEl.className = `login-alert ${type}`;
      alertEl.style.display = 'block';
    }

    // Already signed in? go straight to the dashboard
    fetch('/api/admin?action=me', { credentials: 'same-origin' })
      .then((r) => { if (r.ok) window.location.replace('/admin/'); })
      .catch(() => {});

    if (new URLSearchParams(location.search).get('expired')) showMessage('Your session has expired. Please sign in again.');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';
      alertEl.style.display = 'none';
      try {
        const res = await fetch('/api/admin?action=login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-ZS-Admin': '1' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          window.location.replace('/admin/');
          return;
        }
        showMessage(data.error || 'Invalid administrator email or password.');
      } catch (err) {
        showMessage('Cannot reach the server. Check your connection and try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Authenticate & Access Dashboard →';
      }
    });
  </script>
</body>
</html>
