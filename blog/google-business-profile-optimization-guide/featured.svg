<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#061426"/>
  <defs>
    <radialGradient id="grad1" cx="0.85" cy="0.2" r="0.75">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#061426" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="0.15" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#061426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E05500"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Category Pill Badge -->
  <rect x="85" y="85" width="159" height="38" rx="19" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="109" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">LOCAL SEO</text>
  
  <!-- Dynamic Title Lines -->
  <text x="85" y="190" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800">Google Business Profile</text>
  <text x="85" y="238" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800">Optimization: The Complete</text>
  <text x="85" y="286" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800">Blueprint for Local Leads</text>

  <!-- TOP RIGHT LOGO EMBLEM (perfectly centered at cx=1020, cy=180) -->
  <circle cx="1020" cy="180" r="85" stroke="#10b981" stroke-width="2" fill="rgba(6, 20, 38, 0.7)"/>
  <circle cx="1020" cy="180" r="120" stroke="#ff7a00" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.5"/>
  <!-- Logo box: 60x60, centered at 1020,180 → translate(990,150) -->
  <g transform="translate(990, 150)">
    <rect width="60" height="60" rx="14" fill="url(#logoGrad)"/>
    <path d="M14 16 H46 L22 44 H46" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="16" r="4" fill="#00D2FF"/>
  </g>
  <text x="1020" y="234" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" text-anchor="middle">ZAVRON</text>

  <!-- BOTTOM RIGHT AUTHOR CARD -->
  <rect x="830" y="340" width="280" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <circle cx="875" cy="400" r="26" fill="#061426" stroke="#FF7A00" stroke-width="2.5"/>
  <text x="875" y="406" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" text-anchor="middle">MJ</text>
  <text x="918" y="388" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700">Muhammad Junaid</text>
  <text x="918" y="408" fill="#FF7A00" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">CEO &amp; FOUNDER</text>
  <text x="918" y="426" fill="rgba(255,255,255,0.65)" font-family="Inter, sans-serif" font-size="12">Zavron Solutions</text>
  
  <!-- BOTTOM BRAND BAR (ALIGNED) -->
  <line x1="85" y1="520" x2="1115" y2="520" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="85" y="565" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" letter-spacing="2">ZAVRON SOLUTIONS</text>
  <text x="325" y="565" fill="rgba(255,255,255,0.65)" font-family="Inter, sans-serif" font-size="14">|   Strategic Engineering &amp; Organic Search</text>
  <text x="970" y="565" fill="#10b981" font-family="Inter, sans-serif" font-size="15" font-weight="700">zavronsolutions.com</text>
</svg>